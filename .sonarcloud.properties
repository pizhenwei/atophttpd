# SonarQube Cloud — automatic analysis configuration.
#
# IMPORTANT: in automatic-analysis mode, SonarQube Cloud reads THIS file
# (.sonarcloud.properties) and ignores any sonar-project.properties.
# Wildcard patterns (*, **) are NOT supported here; use plain paths.
#
# Declare the test harness as test code. Sources default to the whole repo;
# declaring tests/ as tests carves it out of the main code set, so the
# production rule profile (security, reliability, ...) no longer applies to
# the fixtures. Do NOT also list tests/ under sonar.sources, otherwise the
# same files would be indexed twice and the analysis would fail.
sonar.tests=tests
